<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Golden Tick Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: control strip → summary tiles → filter chips → channel cards; a side drawer opens per channel with its clips and product queue */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede6; --line:#e2ded3;
  --fg:#1d1b16; --muted:#6c675b; --gold:#b98a12; --gold-soft:#f6e9c3; --gold-ink:#7a5a05;
  --ok:#1f7a4d; --ok-soft:#dcefe3; --warn:#b4570f; --warn-soft:#f8e3cf; --bad:#b3261e; --bad-soft:#f7dcd9;
  --bar:#e8e4d9; --shadow:0 1px 2px rgba(40,30,0,.06),0 8px 24px rgba(40,30,0,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f; --surface:#1e1c16; --surface-2:#26241d; --line:#35322a;
  --fg:#f0ece1; --muted:#a39d8d; --gold:#e3b33a; --gold-soft:#3a3018; --gold-ink:#f2cf74;
  --ok:#5cc28c; --ok-soft:#1d3327; --warn:#f0a35e; --warn-soft:#3a2a1a; --bad:#f08a80; --bad-soft:#3d2120;
  --bar:#2e2b23; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1e1c16; --surface-2:#26241d; --line:#35322a;
  --fg:#f0ece1; --muted:#a39d8d; --gold:#e3b33a; --gold-soft:#3a3018; --gold-ink:#f2cf74;
  --ok:#5cc28c; --ok-soft:#1d3327; --warn:#f0a35e; --warn-soft:#3a2a1a; --bad:#f08a80; --bad-soft:#3d2120;
  --bar:#2e2b23; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.tick{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.tick svg{width:20px;height:20px}
.brand h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1d1b16}

/* targets + tiles */
.targets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.targets b{color:var(--fg);font-family:var(--f-num);font-weight:600}
.tpill{background:var(--surface-2);border-radius:999px;padding:3px 10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile .v{font-family:var(--f-num);font-size:26px;font-weight:600}
.tile .s{font-size:12px;color:var(--muted)}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#q{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-width:0;flex:1 1 180px;max-width:280px}
.sortsel{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sortsel select{font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;color:var(--fg)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card.lv2{box-shadow:inset 0 3px 0 var(--gold)}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cname{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.cmeta{font-size:12px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-lv2{background:var(--gold-soft);color:var(--gold-ink)}
.p-lv0{background:var(--surface-2);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.rank{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.metrics{display:flex;flex-direction:column;gap:8px}
.m{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:12px}
.m .lbl{color:var(--muted)}
.m .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;min-width:70px}
.track{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--warn)}
.fill.full{background:var(--ok)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px}
.clips{display:flex;gap:3px;align-items:center}
.sq{width:10px;height:10px;border-radius:2px;background:var(--bar)}
.sq.on{background:var(--gold)}
.open{color:var(--gold-ink);font-weight:600}
.problem{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* states */
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.notice p{margin:0;flex:1 1 260px}
.skel{height:190px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.card{transition:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,8,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:18px 20px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.drow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{font-size:22px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.dbody{overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box h3{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.box p{margin:0}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.vlist{display:flex;flex-direction:column;gap:10px}
.vday{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.play{width:44px;height:44px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold-ink)}
.vbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.vtitle{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--surface-2);white-space:nowrap}
.lk:hover{border-color:var(--gold)}
.cap{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.cap-row{display:flex;gap:8px;align-items:flex-start}
.cap-row .cap{flex:1;min-width:0}
.small{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1d1b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div>
        <h1>Golden Tick Board</h1>
        <p>ช่องวิดีโอ Shopee · ดึงสดจาก Golden Tick Tracker</p>
      </div>
    </div>
    <div class="sync">
      <span class="stamp" id="stamp"><span class="dot"></span>กำลังเชื่อมต่อชีต…</span>
      <button class="btn" id="refresh" type="button">รีเฟรชตอนนี้</button>
    </div>
  </header>

  <div class="targets" id="targets"></div>
  <section class="tiles" id="tiles" aria-label="ภาพรวม"></section>

  <div class="filters" id="filters">
    <input id="q" type="search" placeholder="ค้นหาช่อง หรือหมวด" aria-label="ค้นหาช่อง">
    <span class="sep" aria-hidden="true"></span>
    <span id="ownerChips" style="display:contents"></span>
    <span class="sep" aria-hidden="true"></span>
    <span id="groupChips" style="display:contents"></span>
    <label class="sortsel" for="sort">เรียง
      <select id="sort">
        <option value="rank">ลำดับเร่ง</option>
        <option value="no">ลำดับในชีต</option>
        <option value="orders">ออเดอร์มากสุด</option>
        <option value="clips">คลิปขาดมากสุด</option>
      </select>
    </label>
  </div>

  <div id="status"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="dhead">
    <div class="drow">
      <div>
        <h2 id="dTitle"></h2>
        <div class="cmeta" id="dMeta"></div>
      </div>
      <button class="x" id="dClose" type="button" aria-label="ปิด">×</button>
    </div>
    <div class="drow" style="flex-wrap:wrap">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="clips" aria-selected="true" type="button">คลิปที่ลงแล้ว</button>
        <button class="tab" role="tab" data-tab="queue" aria-selected="false" type="button">สินค้ารอถ่าย</button>
        <button class="tab" role="tab" data-tab="plan" aria-selected="false" type="button">แผนสัปดาห์นี้</button>
      </div>
      <a class="btn" id="dFile" target="_blank" rel="noopener" href="#">เปิดไฟล์ช่อง ↗</a>
    </div>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="app.js?v=2"></script>
</body>
</html>

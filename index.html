<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
<title>Golden Tick Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header → today's clip goal (hero) → 3 status filters → owner chips → compact channel rows grouped by clip status; tap a row for the detail sheet */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede6; --line:#e4e0d5;
  --fg:#1d1b16; --muted:#6c675b; --gold:#b98a12; --gold-soft:#f6e9c3; --gold-ink:#7a5a05;
  --ok:#1f7a4d; --ok-soft:#dcefe3; --warn:#b4570f; --warn-soft:#f8e3cf; --bad:#b3261e; --bad-soft:#f7dcd9;
  --bar:#e8e4d9;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f; --surface:#1e1c16; --surface-2:#28261e; --line:#36332a;
  --fg:#f0ece1; --muted:#a39d8d; --gold:#e3b33a; --gold-soft:#3a3018; --gold-ink:#f2cf74;
  --ok:#5cc28c; --ok-soft:#1d3327; --warn:#f0a35e; --warn-soft:#3a2a1a; --bad:#f08a80; --bad-soft:#3d2120;
  --bar:#2e2b23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1e1c16; --surface-2:#28261e; --line:#36332a;
  --fg:#f0ece1; --muted:#a39d8d; --gold:#e3b33a; --gold-soft:#3a3018; --gold-ink:#f2cf74;
  --ok:#5cc28c; --ok-soft:#1d3327; --warn:#f0a35e; --warn-soft:#3a2a1a; --bad:#f08a80; --bad-soft:#3d2120;
  --bar:#2e2b23; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.tick{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.tick svg{width:16px;height:16px}
.ttl{min-width:0;flex:1}
.ttl h1{font-family:var(--f-display);font-size:18px;margin:0;line-height:1.2}
.stamp{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.dot.live{background:var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px 40px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hlabel{font-size:13px;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-family:var(--f-num);font-size:40px;line-height:1;font-weight:600}
.big span{font-family:var(--f-num);font-size:18px;color:var(--muted)}
.big em{font-style:normal;margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.hbar{height:10px;border-radius:5px;background:var(--bar);overflow:hidden}
.hbar div{height:100%;background:var(--gold);border-radius:5px;transition:width .4s}

/* status filters */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative}
.st b{font-family:var(--f-num);font-size:22px;line-height:1.15}
.st span{font-size:12px;color:var(--muted)}
.st::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.st[data-s="none"]{--c:var(--bad)} .st[data-s="part"]{--c:var(--warn)} .st[data-s="done"]{--c:var(--ok)}
.st[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}

/* owners */
.owners{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.owners::-webkit-scrollbar{display:none}
.oc{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.oc .num{font-size:12px;color:var(--muted)}
.oc[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.oc[aria-pressed="true"] .num{color:inherit;opacity:.75}

/* list */
.groups{display:flex;flex-direction:column;gap:14px}
.gh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 2px 6px}
.gh i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rows{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:760px){.rows{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.row:active{background:var(--surface-2)}
.ring{width:46px;height:46px;position:relative}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;font-weight:600;letter-spacing:-.02em}
.ring .t.ok{color:var(--ok)}
.rname{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta .num{font-size:11.5px}
.rend{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-lv2{background:var(--gold-soft);color:var(--gold-ink)}
.p-lv0{background:var(--surface-2);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.left{font-size:11.5px;color:var(--bad);font-weight:600;white-space:nowrap}
.left.ok{color:var(--ok)}

/* states */
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.notice p{margin:0}
.skel{height:62px;border-radius:12px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:24px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.skel,.iconbtn.spin svg{animation:none}.hbar div{transition:none}}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,0,.45);z-index:20}
.drawer{position:fixed;z-index:21;background:var(--bg);display:flex;flex-direction:column;
  left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:760px){.drawer{left:auto;top:0;width:560px;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top,0px)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
@media (min-width:760px){.grab{display:none}}
.dhead{padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.drow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h2{font-family:var(--f-display);font-size:20px;margin:0;line-height:1.25}
.cmeta{font-size:12px;color:var(--muted)}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:18px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.kpi span{font-size:10.5px;color:var(--muted)}
.kpi b{font-family:var(--f-num);font-size:14px;font-weight:600}
.kpi b small{font-size:11px;color:var(--muted);font-weight:500}
.kpi.ok b{color:var(--ok)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:10px;overflow-x:auto}
.tab{flex:1;padding:6px 10px;border-radius:7px;font-weight:500;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dbody{overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:0}
.box p{margin:0}
.vlist{display:flex;flex-direction:column;gap:8px}
.vday{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.vitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.play{width:36px;height:36px;border-radius:9px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold-ink)}
.vbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.vtitle{font-weight:600;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--surface-2);white-space:nowrap}
.cap-row{display:flex;gap:8px;align-items:flex-start}
.cap{flex:1;min-width:0;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap gut">
    <div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1d1b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="ttl">
      <h1>Golden Tick Board</h1>
      <div class="stamp" id="stamp"><span class="dot"></span>กำลังเชื่อมต่อชีต…</div>
    </div>
    <button class="iconbtn" id="refresh" type="button" aria-label="รีเฟรชตอนนี้"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>
</header>

<main>
  <div class="wrap gut">
    <section class="hero" aria-label="เป้าคลิป">
      <div class="hrow">
        <span class="hlabel" id="heroLabel">คลิปวันนี้ ทุกช่อง</span>
        <div class="seg" role="group" aria-label="ช่วงเวลา">
          <button type="button" data-mode="today" aria-pressed="true">วันนี้</button>
          <button type="button" data-mode="week" aria-pressed="false">สัปดาห์นี้</button>
        </div>
      </div>
      <div class="big"><b id="heroDone">0</b><span id="heroGoal">/ 0</span><em id="heroLeft"></em></div>
      <div class="hbar"><div id="heroBar" style="width:0%"></div></div>
    </section>

    <div class="stats" id="stats"></div>
    <div class="owners" id="owners"></div>
    <div id="status"></div>
    <section class="groups" id="groups" aria-live="polite"></section>
    <p class="foot" id="foot"></p>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="grab" aria-hidden="true"></div>
  <div class="dhead">
    <div class="drow">
      <div style="min-width:0">
        <h2 id="dTitle"></h2>
        <div class="cmeta" id="dMeta"></div>
      </div>
      <button class="x" id="dClose" type="button" aria-label="ปิด">×</button>
    </div>
    <div class="kpis" id="dKpis"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="clips" aria-selected="true" type="button">คลิปที่ลงแล้ว</button>
      <button class="tab" role="tab" data-tab="queue" aria-selected="false" type="button">สินค้ารอถ่าย</button>
      <button class="tab" role="tab" data-tab="plan" aria-selected="false" type="button">แผนสัปดาห์</button>
    </div>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="app.js?v=4"></script>
</body>
</html>
